<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Poster Boy</title>
  <meta name="description" content="Poster Boy — dream pop.">
  <meta name="theme-color" content="#1c1230">
  <link rel="icon" href="data:,">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body data-state="intro">

  <!-- Escena 3D: playa de Mazarrón al atardecer -->
  <canvas id="scene" aria-hidden="true"></canvas>

  <main id="ui">
    <header class="logo">
      <h1><img class="logo__img" src="assets/img/logo.png" alt="Poster Boy" width="1420" height="404"></h1>
    </header>

    <p class="press">Start</p>

    <nav class="menu" aria-label="Choose your fighter">
      <p class="menu__title">choose your fighter &lt;3</p>
      <ul>
        <li><button type="button" data-char="maria">maría</button></li>
        <li><button type="button" data-char="luz">luz</button></li>
      </ul>
    </nav>

    <button type="button" class="char-back" id="char-back">← volver</button>

  </main>

  <section class="panel" id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="panel-title">
    <div class="panel__window">
      <header class="panel__head">
        <span class="panel__tag" id="panel-tag">01</span>
        <h2 class="panel__title" id="panel-title"></h2>
      </header>
      <div class="panel__body" id="panel-body"></div>
      <footer class="panel__foot">
        <button type="button" class="panel__back" id="panel-back">← volver <kbd>esc</kbd></button>
      </footer>
    </div>
  </section>

  <div class="vignette" aria-hidden="true"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
